name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Публикация на Pages идёт по одному развёртыванию за раз. При частых
# коммитах прогоны копятся в очереди, и обновление на роутере приходит
# с опозданием на несколько сборок. Отменяем устаревшие: имеет значение
# только последний коммит.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Юнит-тесты и сборка целиком
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee /tmp/check.log

      # Логи шагов через API без прав администратора не читаются: они
      # отдают 403. Поэтому хвост уходит двумя путями — в сводку запуска,
      # где его видно человеку, и аннотацией, которая доступна по API без
      # всяких прав. Иначе разбор падения превращается в пересылку
      # снимков экрана туда-обратно.
      - name: Показать, на чём упало
        if: failure()
        shell: bash
        run: |
          {
            echo '### Хвост проверок'
            echo '```'
            tail -60 /tmp/check.log 2>/dev/null || echo 'лог не создан'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          msg=$(tail -40 /tmp/check.log 2>/dev/null |
                python3 -c "import sys; print(sys.stdin.read()
                    .replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::error title=Хвост проверок::$msg"

  build:
    name: Сборка под Keenetic
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Кеш тулчейнов
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: /opt/toolchains
          key: musl-cross-20260823-v2

      - name: Скачать тулчейны
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: sudo -E sh tools/fetch-toolchains.sh /opt/toolchains

      - name: Добавить в PATH
        run: |
          for tc in aarch64-unknown-linux-musl mipsel-unknown-linux-muslsf mips-unknown-linux-muslsf; do
            echo "/opt/toolchains/$tc/bin" >> "$GITHUB_PATH"
          done

      # REVISION нужен и здесь: версия зашивается в бинарник при компиляции.
      # Без этого демон в журнале сообщал 0.1.0-1, а пакет назывался
      # 0.1.0-6, и понять, что реально стоит на роутере, было нельзя.
      - name: Собрать бинарники
        run: make all REVISION=${{ github.run_number }}

      - name: Проверить, что бинарники под нужные архитектуры
        run: |
          set -e
          file build/shadowfoxd-aarch64 | grep -q 'ARM aarch64'
          file build/shadowfoxd-mipsel  | grep -qi 'MIPS'
          file build/shadowfoxd-mips    | grep -qi 'MIPS'
          # Статическая линковка обязательна: на роутере нет ни musl,
          # ни гарантии совместимости с системным libc.
          for b in build/shadowfoxd-*; do
            file "$b" | grep -q 'statically linked' || {
              echo "$b слинкован динамически"; exit 1; }
            # Версия внутри бинарника обязана совпадать с версией пакета,
            # иначе по журналу на роутере не понять, что там работает.
            strings "$b" | grep -q "0.1.0-${{ github.run_number }}" || {
              echo "$b собран не с той версией"; exit 1; }
          done

      # Ревизия равна номеру прогона: без этого каждая пересборка даёт
      # ту же версию 0.1.0-1, opkg считает её уже установленной и
      # `opkg upgrade` молча ничего не делает.
      # Ядро собирается отдельным процессом и лежит в выпуске: класть его
      # сборку сюда значило бы добавлять минуты Go-компиляции к каждой
      # правке строчки в интерфейсе. Публикация Pages заменяет сайт
      # целиком, поэтому ядро надо подложить в фид перед его сборкой,
      # иначе оно исчезнет при первом же обновлении демона.
      - name: Подложить ядро из выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ipk
          if gh release download xray --pattern '*.ipk' --dir build/ipk --clobber 2>/dev/null; then
              echo "ядро добавлено в фид:"
              ls -1 build/ipk/shadowfox-xray_*.ipk 2>/dev/null || true
          else
              echo "выпуска xray пока нет — фид будет без ядра" >&2
          fi

      # Закрытый ключ подписи фида живёт только в секрете репозитория.
      # Без него фид собирается, но роутер его не примет: shadowfox-update
      # проверяет подпись индекса. Пишем ключ во временный файл вне
      # рабочего каталога и стираем сразу после сборки.
      - name: Собрать пакеты и фид
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          if [ -z "$SIGN_KEY" ]; then
              echo "::error title=Нет секрета SIGN_KEY::фид останется без подписи, роутер его не примет"
              exit 1
          fi
          keyfile=$(mktemp)
          printf '%s\n' "$SIGN_KEY" > "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          SIGN_KEY_FILE="$keyfile" make feed REVISION=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: build/ipk/*.ipk

      - uses: actions/upload-artifact@v4
        with:
          name: feed
          path: build/feed

  publish:
    name: Публикация фида
    runs-on: ubuntu-latest
    needs: build
    # Публикуем и с main, а не только с тегов: файлы заливаются через
    # веб-интерфейс GitHub, теги при этом не создаются, а фид нужен сразу.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: feed
          path: feed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed
      - id: deploy
        uses: actions/deploy-pages@v4
