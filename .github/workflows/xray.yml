name: xray

# Ядро Xray собирается отдельно от демона: это чужой апстрим с закреплённой
# версией, сборка тяжёлая, и на каждый push она не нужна.
on:
  workflow_dispatch:
    inputs:
      xray_version:
        description: Тег Xray-core
        default: v26.7.28
  push:
    tags: ['v*']
  schedule:
    # Раз в неделю: обрезка правит структуру infra/conf апстрима, и если
    # она сломается при обновлении Xray, узнать об этом лучше заранее,
    # а не в тот момент, когда сборка внезапно понадобится.
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    # Выкладка выпуска требует права на запись: без него gh release
    # падает, а по умолчанию токен процесса только читает.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Логи шагов через API без прав администратора не читаются, поэтому
      # при падении показываем хвост прямо в сводке запуска: она видна
      # всем и не требует лазить по шагам.
      - name: Собрать ядро, которое публикуем
        shell: bash
        run: |
          set -o pipefail
          sh xray/build.sh --variant lean \
             --version "${{ github.event.inputs.xray_version || 'v26.7.28' }}" \
             2>&1 | tee -a /tmp/xray.log

      - name: Проверить, что сборка принимает эталонный конфиг
        shell: bash
        run: |
          set -o pipefail
          sh xray/check.sh lean 2>&1 | tee -a /tmp/xray.log

      - name: Собрать пакеты ядра
        shell: bash
        run: |
          set -o pipefail
          VER="${{ github.event.inputs.xray_version || 'v26.7.28' }}"
          sh xray/build-ipk.sh --variant lean --version "${VER#v}" 2>&1 | tee -a /tmp/xray.log
          ls -la build/ipk/

      - name: Выложить в выпуск
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          VER="${{ github.event.inputs.xray_version || 'v26.7.28' }}"
          cat > /tmp/notes.md <<NOTES
          Урезанная сборка Xray-core $VER для Shadow Fox: только VLESS-клиент.

          Ставится в /opt/sbin/shadowfox-xray и не конфликтует со штатным
          пакетом. Обрезка описана в xray/trim.py.

          Пакеты отсюда подкладываются в фид основным процессом сборки.
          NOTES
          {
            gh release delete xray --yes --cleanup-tag 2>/dev/null || true
            gh release create xray build/ipk/shadowfox-xray_*.ipk \
              --title "Ядро Xray $VER" --notes-file /tmp/notes.md
          } 2>&1 | tee -a /tmp/xray.log

      # Сравнение вариантов идёт после публикации: оно нужно, чтобы
      # видеть, во что обходится обрезка, но ронять из-за него выкладку
      # рабочего ядра неправильно.
      - name: Сравнить размеры вариантов
        shell: bash
        run: |
          set -o pipefail
          sh xray/build.sh \
             --version "${{ github.event.inputs.xray_version || 'v26.7.28' }}" \
             2>&1 | tee -a /tmp/xray.log
          for v in full lean-plus; do sh xray/check.sh "$v" 2>&1 | tee -a /tmp/xray.log; done

      # Сквозная проверка: конфиги нашего генератора скармливаются
      # настоящему ядру. Держим её здесь, потому что только тут оно есть.
      - name: Прогнать через ядро конфиги генератора
        shell: bash
        env:
          SF_REQUIRE_XRAY: "1"
        run: |
          set -o pipefail
          make native
          sh tools/check-configs.sh 2>&1 | tee -a /tmp/xray.log

      - name: Показать, на чём упало
        if: failure()
        run: |
          {
            echo '### Хвост сборки'
            echo '```'
            tail -80 /tmp/xray.log 2>/dev/null || echo 'лог не создан — упало до первого шага'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: xray-binaries
          path: build/xray/out/*
