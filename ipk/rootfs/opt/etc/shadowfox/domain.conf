# Домены, которые нужно заворачивать в туннель.
#
# Формат — группы, как в веб-интерфейсе:
#
#   [имя-группы]
#   interface = Proxy0        # куда заворачивать всю группу
#   example.com               # домен и все его поддомены
#   *.wildcard.example.com    # маска
#
# Строки, начинающиеся с # или ;, игнорируются.
# Пустой файл — маршрутизация по доменам выключена.
#
# Interface — системный идентификатор интерфейса Keenetic, а не его
# описание. Штатный прокси-клиент, поверх которого работает xray, — это
# Proxy0. Список доступных: ndmc -c "show interface" | grep -i 'id:'

# [example]
# interface = Proxy0
# example.com
