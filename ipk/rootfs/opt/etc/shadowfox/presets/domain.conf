# Домены, которые нужно заворачивать в туннель.
#
#   [имя-группы]
#   interface = ShadowFox      # политика Keenetic либо сетевой интерфейс
#   example.com                # домен и все его поддомены
#   *.wildcard.example.com     # только поддомены
#   =exact.example.com         # точное совпадение
#
# Готовые группы ниже — стартовый набор. Правится на странице,
# раздел «Правила», или прямо здесь. Посмотреть, что получится:
# shadowfoxd --dry-run

[YouTube]
interface = ShadowFox
youtube.com
youtu.be
