# Конфигурация shadowfox
# Любой параметр доступен и как флаг CLI: --имя значение.
# Приоритет: CLI > этот файл > встроенные значения.
# Полный файл со всеми ключами: shadowfoxd --genconfig /opt/etc/shadowfox

# Уровень логирования: off | error | warn | info | debug
log=info

# Файл журнала. Пустое значение — писать в stderr.
logFile=/opt/var/log/shadowfoxd.log

# PID-файл. По нему ndm-хуки находят демона и шлют SIGUSR1.
pidFile=/opt/var/run/shadowfoxd.pid

# Поднимать маршрутизацию сразу при старте.
autoStart=yes

# Где лежат domain.conf и ip.list.
confDir=/opt/etc/shadowfox

# Интерфейс, на котором ловим DNS-ответы. Обычно мост локальной сети.
# Пустое значение — слушать все интерфейсы.
interface=br0

# Обслуживать ли IPv6.
ipv6=yes

# Разрешить демону заводить недостающие политики на роутере и сохранять
# его конфигурацию. Это изменение настроек устройства, поэтому по
# умолчанию выключено: политику создаёт администратор через панель.
createPolicy=no

# Сколько секунд живёт адрес в наборе. Домен, который перестали
# резолвить, выпадает сам, и набор не копит адреса, давно переехавшие к
# другим сервисам. 0 отключает старение.
ipsetTimeout=86400

# Свой экземпляр Xray и своё прокси-подключение в Keenetic.
# nodesFile — файл со ссылками vless:// либо подпиской. Пока его нет,
# свой Xray не запускается, и маршрутизация работает через то
# подключение, которое настроено вручную.
nodesFile=/opt/etc/shadowfox/nodes.txt
xrayConfig=/opt/etc/shadowfox/xray.json

# Порт своего socks. У HydraRoute занят 1300 — берём соседний.
socksPort=1301

# Подключение Keenetic и политика, в которую оно входит.
# Команды для их создания печатает: shadowfoxd --setup-proxy
proxyInterface=Proxy1
policy=ShadowFox
