# Конфигурация shaper
# Любой параметр доступен и как флаг CLI: --имя значение.
# Приоритет: CLI > этот файл > встроенные значения.
# Полный файл со всеми ключами: shaperd --genconfig /opt/etc/shaper

# Уровень логирования: off | error | warn | info | debug
log=info

# Файл журнала. Пустое значение — писать в stderr.
logFile=/opt/var/log/shaperd.log

# PID-файл. По нему ndm-хуки находят демона и шлют SIGUSR1.
pidFile=/opt/var/run/shaperd.pid

# Поднимать маршрутизацию сразу при старте.
autoStart=yes
