<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Fox</title>
<style>
:root{
  --bg:#0d1014;--panel:#151a21;--card:#1b212a;--line:#28303b;
  --fg:#e8ecf2;--dim:#8b95a5;--acc:#22b8d6;--ok:#3ddc84;--bad:#ff6b6b;--warn:#ffc861;
}
:root[data-theme=light]{
  --bg:#f2f4f7;--panel:#fff;--card:#fff;--line:#dfe4ea;
  --fg:#1a1f27;--dim:#6b7686;--acc:#0e9cba;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;display:flex;flex-direction:column}
a{color:var(--acc)}

header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:13px}
.logo svg,.logo .mark{width:50px;height:50px;flex:0 0 auto;display:block}
.logo b{font:650 22px/1.1 "Avenir Next","Futura","Century Gothic",
        "Segoe UI Semibold",Inter,system-ui,sans-serif;letter-spacing:.03em}
.logo span{color:var(--dim);font-size:11.5px;display:block;line-height:1;
        margin-top:4px;letter-spacing:.08em}
.spacer{flex:1}
.meters{display:flex;gap:16px;font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--dim)}
.meter b{color:var(--fg);font-weight:600}
.tbtn{background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:15px}
a.tbtn{display:grid;place-items:center;text-decoration:none}
a.tbtn:hover{color:var(--bad);border-color:var(--bad)}

/* Подвал прижат книзу колонкой, а не расчётом высоты: раньше .wrap
   растягивался на весь экран и уводил подвал под нижний край. */
.wrap{display:flex;flex:1;min-height:0}
nav{width:96px;background:var(--panel);border-right:1px solid var(--line);
    padding:12px 0;flex:0 0 auto}
nav button{display:block;width:100%;padding:13px 4px 11px;background:none;border:0;
    border-left:3px solid transparent;color:var(--dim);cursor:pointer;
    font:inherit;font-size:11.5px;line-height:1.3}
nav button svg{display:block;margin:0 auto 6px;width:26px;height:26px;
    fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
nav button:hover{color:var(--fg)}
nav button.on{color:var(--acc);border-left-color:var(--acc);background:var(--card)}
main{flex:1;padding:20px 24px 60px;min-width:0;max-width:1100px}

h2{margin:0 0 18px;font-size:19px;font-weight:650;border-left:3px solid var(--acc);padding-left:11px}
.rule{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:10px;margin-bottom:14px;overflow:hidden}
.rule.off{border-left-color:var(--dim)}
.rule>.top{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer}
.rule>.top b{font-size:14.5px}
.rule>.top .tgt{color:var(--dim);font-size:13px}
.rule>.body{display:none;padding:0 15px 15px}
.rule.open>.body{display:block}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px}
.grp .gh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grp .gh input{flex:1;background:none;border:0;color:var(--fg);font:600 13.5px/1.4 inherit;padding:2px 0;min-width:0}
.grp .gh input:focus{outline:0;border-bottom:1px solid var(--acc)}
.grp.off{opacity:.55}
.sw{flex:0 0 auto;width:36px;height:20px;border-radius:10px;border:0;padding:0;
    background:var(--line);cursor:pointer;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
    border-radius:50%;background:var(--panel);transition:transform .15s}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(16px)}
.icon.del:hover{color:var(--bad)}
.grp textarea{width:100%;height:120px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px;font:12.5px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.add{border:1px dashed var(--line);border-radius:9px;display:grid;place-items:center;min-height:120px;cursor:pointer;color:var(--dim);font-size:26px}
.add:hover{color:var(--acc);border-color:var(--acc)}
.icon{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:2px 4px}
.icon:hover{color:var(--bad)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:15.5px}
.card p{margin:0 0 12px;color:var(--dim);font-size:14px;line-height:1.7}
label{display:block;color:var(--dim);font-size:12.5px;margin:10px 0 5px}
input[type=text],textarea.wide{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;font:13px/1.5 inherit}
textarea.wide{min-height:130px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,monospace;margin:0;color:var(--dim)}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12.5px}

button.b{background:var(--acc);color:#04222a;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:650;cursor:pointer}
button.b.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
button.b:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--dim)}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
footer{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;
    padding:14px 20px;border-top:1px solid var(--line);background:var(--panel);
    color:var(--dim);font-size:12.5px}
footer b{color:var(--fg);font-weight:600}
footer .sp{flex:1}
footer a{display:inline-flex;align-items:center;gap:6px;color:var(--dim);
    text-decoration:none;border:1px solid var(--line);border-radius:8px;
    padding:6px 12px}
footer a:hover{color:var(--fg);border-color:var(--acc)}
footer .ver{border:1px solid var(--line);border-radius:8px;padding:5px 12px;
    line-height:1.3;text-align:center}

.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:0 26px}
@media(max-width:820px){.rows{grid-template-columns:1fr}main{padding:16px 14px 60px}.groups{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--dim)}
.fine{max-width:760px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;
    display:grid;place-items:center;padding:22px}
.modal .box{background:var(--panel);border:1px solid var(--line);
    border-top:4px solid var(--warn);border-radius:14px;
    width:min(720px,100%);max-height:86vh;overflow:auto;padding:24px 28px 22px;
    box-shadow:0 18px 60px rgba(0,0,0,.45)}
.modal h3{margin:0 0 4px;text-align:center;color:var(--warn);font-size:19px}
.modal .sub{text-align:center;color:var(--dim);font-size:13px;margin:0 0 18px}
.modal .ok{display:block;width:100%;margin-top:20px}
.fine p{color:var(--fg);font-size:14.5px;line-height:1.8;margin:0 0 14px}
.fine ul{color:var(--fg);font-size:14.5px;line-height:1.8;
    margin:0 0 14px;padding-left:22px}
.fine li{margin-bottom:8px}
.fine p:last-child{margin-bottom:0}
.fine h3{font-size:16px;margin-bottom:12px}
</style>

<header>
  <div class="logo">
    <!--ЛОГОТИП-->
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path fill="var(--acc)" d="M10 6l9 10h26l9-10 3 18c0 6-3 11-8 15l-9 7-8 8-8-8-9-7c-5-4-8-9-8-15z"/>
      <path fill="var(--bg)" d="M22 27c0-3 3-5 7-5h6v4h-8v3h6c3 0 5 2 5 5s-2 5-5 5h-8v-4h8v-3h-5c-4 0-6-2-6-5zm18-5h11v4h-7v3h6v4h-6v7h-4z"/>
    </svg>
    <!--/ЛОГОТИП-->
    <div><b>Shadow&nbsp;Fox</b><span id="ver"></span></div>
  </div>
  <div class="spacer"></div>
  <div class="meters">
    <div class="meter">ядро <b id="m-xray">—</b></div>
    <div class="meter">адресов <b id="m-addr">—</b></div>
    <div class="meter">помечено <b id="m-mark">—</b></div>
  </div>
  <button class="tbtn" id="theme" title="Тема">◐</button>
  <a class="tbtn out" href="/logout" title="Выйти">⏻</a>
</header>

<div id="gate" hidden></div>
<div id="dns" hidden></div>

<div class="wrap">
  <nav>
    <button data-tab="rules" class="on"><svg viewBox="0 0 24 24"
      ><path d="M4 6h7M4 12h16M4 18h11"/><circle cx="15" cy="6" r="2.2"
      /><circle cx="18.5" cy="18" r="2.2"/></svg>Правила</button>
    <button data-tab="conn"><svg viewBox="0 0 24 24"
      ><path d="M12 3v5M12 16v5M4.9 7.5l4.3 2.5M14.8 14l4.3 2.5M19.1 7.5l-4.3 2.5M9.2 14l-4.3 2.5"
      /><circle cx="12" cy="12" r="2.6"/></svg>Подключения</button>
    <button data-tab="info"><svg viewBox="0 0 24 24"
      ><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"
      /></svg>Информация</button>
  </nav>
  <main id="view">загружаю…</main>
</div>

<footer id="foot"></footer>

<script>
const $=s=>document.querySelector(s);
const tok=new URLSearchParams(location.search).get('token');
const api=p=>tok?p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(tok):p;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null, tab='rules', openRule=0, dnsShown=0, nodesMode='masked';

/* --- тема --- */
const theme=localStorage.getItem('sf-theme')||'dark';
document.documentElement.dataset.theme=theme;
$('#theme').onclick=()=>{
  const t=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=t;
  localStorage.setItem('sf-theme',t);
};

/* --- разбор domain.conf в правила --- */
function parseDomains(text){
  const groups=[]; let g=null;
  for(const raw of String(text).split('\n')){
    const s=raw.trim();
    if(!s||s[0]==='#'||s[0]===';') continue;
    const h=s.match(/^\[(.+)\]$/);
    if(h){ g={name:h[1].trim(),target:'',on:true,lines:[]}; groups.push(g); continue; }
    const kv=s.match(/^interface\s*=\s*(.+)$/i);
    if(kv){ if(g) g.target=kv[1].trim(); continue; }
    const en=s.match(/^enabled\s*=\s*(.+)$/i);
    if(en){ if(g) g.on=!/^(no|off|false|0)$/i.test(en[1].trim()); continue; }
    if(g) g.lines.push(s);
  }
  const rules=[];
  for(const x of groups){
    let r=rules.find(r=>r.target===x.target);
    if(!r){ r={target:x.target,groups:[]}; rules.push(r); }
    r.groups.push(x);
  }
  return rules;
}

function freeName(rules){
  const used=new Set();
  for(const r of rules) for(const g of r.groups) used.add(g.name);
  for(let i=1;;i++){ const n='группа '+i; if(!used.has(n)) return n; }
}

function buildDomains(rules){
  const out=[];
  for(const r of rules)
    for(const g of r.groups){
      out.push('['+g.name+']','interface = '+r.target);
      if(g.on===false) out.push('enabled = no');
      out.push(...g.lines);
      out.push('');
    }
  return out.join('\n');
}

/* --- отрисовка --- */
function head(){
  $('#ver').textContent=D.version;
  $('#m-xray').textContent=D.xray_pid>0?'работает':'нет';
  $('#m-addr').textContent=D.matched;
  $('#m-mark').textContent=D.marked;
}

function viewRules(){
  const rules=parseDomains(D.domains);
  if(!rules.length)
    return `<h2>Правила маршрутизации</h2>
      <div class="card"><h3>Правил пока нет</h3>
      <p>Правило — это цель, куда заворачивается трафик: политика Keenetic
      либо сетевой интерфейс. Внутри правила — группы: в каждой домены и
      адреса, по одному в строке.</p>
      <button class="b" id="newrule">Создать правило</button></div>`;

  return `<h2>Правила маршрутизации</h2>`
   + rules.map((r,i)=>`
    <div class="rule ${i===openRule?'open':''}" data-i="${i}">
      <div class="top"><b>${esc(r.target||'без цели')}</b>
        <span class="tgt">— групп ${r.groups.length}${
          r.groups.some(g=>g.on===false)
            ? ', работают ' + r.groups.filter(g=>g.on!==false).length : ''
        }</span></div>
      <div class="body"><div class="groups">
        ${r.groups.map((g,k)=>`
          <div class="grp ${g.on===false?'off':''}" data-r="${i}" data-g="${k}">
            <div class="gh">
              <button class="sw ${g.on===false?'':'on'}" data-toggle
                title="${g.on===false?'Включить группу':'Выключить группу'}"></button>
              <input value="${esc(g.name)}" data-name>
              <button class="icon del" data-del title="Удалить группу">✕</button>
            </div>
            <textarea spellcheck="false" data-lines
              placeholder="домены и адреса, по одному в строке"
              >${esc(g.lines.join('\n'))}</textarea>
          </div>`).join('')}
        <div class="add" data-addgrp="${i}">+</div>
      </div>
      <div class="bar"><button class="b" id="save-rules">Сохранить и применить</button>
        <span class="msg" id="m-rules"></span></div>
      </div>
    </div>`).join('')
   + `<div class="bar"><button class="b ghost" id="newrule">+ правило</button></div>`;
}

function viewConn(){
  const P=D.proxy_name, POL=D.policy_name, host=location.hostname;
  const cmds=[
   `ndmc -c "interface ${P}"`,
   `ndmc -c "interface ${P} description Shadow-Fox"`,
   `ndmc -c "interface ${P} security-level public"`,
   `ndmc -c "interface ${P} ip global 1"`,
   `ndmc -c "interface ${P} proxy protocol socks5"`,
   `ndmc -c "interface ${P} proxy upstream ${host} ${D.socks_port}"`,
   `ndmc -c "interface ${P} proxy socks5-udp"`,
   `ndmc -c "interface ${P} up"`,
   `ndmc -c "system configuration save"`].join('\n');

  const dot=(v,t)=>`<span class="st"><i class="dot ${v?'ok':'bad'}"></i>${t}</span>`;

  return `<h2>Подключения</h2>

  <div class="card">
    <h3>Ядро Xray</h3>
    ${D.xray_bin
      ? `<p>${dot(1,'установлено')} &nbsp; <code>${esc(D.xray_bin)}</code></p>
         <p>Устанавливать ничего не нужно. Shadow Fox поднимает свой отдельный
         процесс на порту ${D.socks_port} и чужой не трогает.</p>`
      : `<p>${dot(0,'не установлено')}</p>
         <p>Выполни в консоли роутера:</p><pre>opkg install xray</pre>`}
  </div>

  <div class="card">
    <h3>Сервер</h3>
    <p>Ссылки <code>vless://</code> по одной в строке либо подписка целиком.
    При нескольких выбирается самый быстрый. Конфиг проверяется ядром до
    применения: негодный не заменит рабочий.</p>
    <label>Ссылки</label>
    <textarea class="wide" id="nodes" spellcheck="false"
      placeholder="vless://..." ${nodesMode==='masked'?'readonly':''}
      >${esc(nodesMode==='new' ? '' : D.nodes)}</textarea>
    <div class="bar">
      ${nodesMode==='masked'
        ? `<button class="b ghost" id="nodes-show">Показать</button>
           <button class="b" id="nodes-new">Заменить</button>`
        : `<button class="b" data-save="nodes">Сохранить и запустить</button>
           <button class="b ghost" id="nodes-hide">Скрыть</button>`}
      <span class="msg" id="m-nodes"></span></div>
    ${nodesMode==='masked'
      ? `<p style="margin:10px 0 0;font-size:13px">Ключ скрыт: он не
         передаётся странице, пока не нажать «Показать».</p>` : ''}
  </div>

  <div class="card">
    <h3>Подключение в роутере</h3>
    <p>${dot(D.proxy_ready, D.proxy_ready?`${esc(P)} создано`:`${esc(P)} не создано`)}</p>
    ${D.proxy_ready?'':`<p>Выполни в консоли роутера — эти команды меняют его
      настройки, поэтому делаются вручную:</p><pre>${esc(cmds)}</pre>`}
  </div>

  <div class="card">
    <h3>Политика доступа</h3>
    <p>${dot(D.policy_ready, D.policy_ready?`${esc(POL)} готова`:`${esc(POL)} не настроена`)}</p>
    <p>В панели роутера: <b>Приоритеты подключений → Политики доступа</b>.
    Политика <code>${esc(POL)}</code> должна содержать <b>только</b> подключение
    Shadow-Fox. Без этого шага метка будет, а заворачивать трафик станет
    некуда — и молча себя это не проявит.</p>
  </div>

  <div class="card">
    <h3>Подсети</h3>
    <p>Отдельного списка больше нет: адреса и подсети пишутся в те же
    группы, что и домены — <code>104.244.42.0/24</code> или
    <code>8.8.8.8</code> отдельной строкой. Это нужно сервисам с
    зашитыми адресами, которые DNS не спрашивают: там ловить нечего.</p>
  </div>`;
}

function viewInfo(){
  return `<h2>Информация</h2>
  <div class="card">
    <h3>Состояние</h3>
    <div class="rows">
      ${kv('Версия',esc(D.version))}
      ${kv('Демон','работает, '+esc(D.uptime))}
      ${kv('Своё ядро',D.xray_pid>0?'работает':'не запущено')}
      ${kv('Перехват',D.capture?'на '+esc(D.iface):'выключен')}
      ${kv('Пакетов',D.seen)}
      ${kv('Ответов',D.parsed)}
      ${kv('Адресов',D.matched)}
      ${kv('Правила',D.rules?'установлены':'нет')}
      ${kv('Помечено',D.marked+' соединений')}
      ${kv('DNS устройства', D.dns==='ok' ? 'через роутер'
           : D.dns==='bypass' ? 'мимо роутера' : 'пока не видно')}
    </div>
  </div>
  <div class="card">
    <h3>Как это работает</h3>
    <p style="line-height:1.9">
    Домен из правила &rarr; перехват DNS-ответа &rarr; адрес в ipset &rarr;
    метка на соединении &rarr; политика Keenetic &rarr; подключение &rarr;
    свой Xray &rarr; сервер.<br>
    Перехват пассивный: если демон упадёт, DNS у сети продолжит работать.
    Адреса в наборах стареют, чтобы не копить давно переехавшие.</p>
  </div>

  <div class="card fine">
    <h3>Отказ от ответственности</h3>${disclaimer()}
    <p style="margin-top:14px"><a href="#" id="reshow">Показать при следующем входе</a></p>
  </div>`;
}
const kv=(k,v)=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`;

/* Один текст на карточку и на плашку: две копии разойдутся при
   первой же правке, а расхождение в таком тексте — не мелочь. */
function disclaimer(){ return `<p>Shadow Fox распространяется «как есть», без каких-либо гарантий,
    обязательств или заверений, явных либо подразумеваемых. Использование
    осуществляется пользователем на собственный риск.</p>

    <p>Автор не несёт ответственности за любые последствия использования
    или невозможности использования программного продукта, включая, но не
    ограничиваясь:</p>
    <ul>
      <li>сбоями, неисправностями, ошибками или иными нарушениями работы
      оборудования, программного обеспечения или сетевых сервисов;</li>

function foot(){
  $('#foot').innerHTML = `
    ${D.osver ? `<span>Версия ОС <b>${esc(D.osver)}</b></span>` : ''}
    ${D.model ? `<span>Модель <b>${esc(D.model)}</b></span>` : ''}
    <span class="sp"></span>
    <span class="ver">Shadow&nbsp;Fox<br><b>${esc(D.version)}</b></span>
    <a href="https://github.com/SkunkBG/shadowfox" target="_blank"
       rel="noopener">GitHub</a>`;
}

function draw(){
  head();
  foot();
  $('#view').innerHTML = tab==='rules'?viewRules() : tab==='conn'?viewConn() : viewInfo();
}

async function load(probed){
  try{
    const r=await fetch(api('/data' + (probed ? '?probed=1' : '')));
    if(!r.ok) throw new Error('код '+r.status);
    D=await r.json();
    draw();

    /* Не поверх согласия: две плашки разом читать невозможно. */
    if(D.dns==='bypass' && !dnsShown && $('#gate').hidden){ dnsShown=1; dnsWarn(); }
  }catch(e){
    $('#view').innerHTML='<p style="color:var(--bad)">Нет связи с демоном: '+esc(e.message)+'</p>';
  }
}

/* --- собрать правила со страницы --- */
function collect(drop){
  const rules=parseDomains(D.domains);
  document.querySelectorAll('.grp').forEach(el=>{
    const r=+el.dataset.r, g=+el.dataset.g;
    if(!rules[r]||!rules[r].groups[g]) return;
    rules[r].groups[g].name=el.querySelector('[data-name]').value.trim()||'без имени';
    rules[r].groups[g].on=el.querySelector('[data-toggle]').classList.contains('on');
    rules[r].groups[g].lines=el.querySelector('[data-lines]').value
      .split('\n').map(s=>s.trim()).filter(Boolean);
  });
  if(drop) for(const r of rules) r.groups=r.groups.filter(g=>g.lines.length);
  /* Счётчик в заголовке считает работающие группы, а не все подряд. */
  return rules.filter(r=>r.groups.length);
}

async function save(what,text,msgId){
  const m=$('#'+msgId);
  m.className='msg'; m.textContent='сохраняю…';
  try{
    const r=await fetch(api('/save?what='+what),{method:'POST',body:text});
    const t=(await r.text()).trim();
    m.className=r.ok?'msg ok':'msg bad';
    m.textContent=t||(r.ok?'готово':'ошибка');
    if(r.ok){ if(what==='nodes') nodesMode='masked'; setTimeout(load,1500); }
  }catch(e){ m.className='msg bad'; m.textContent=e.message; }
}

document.addEventListener('click',async ev=>{
  const nav=ev.target.closest('nav button');
  if(nav){ tab=nav.dataset.tab; if(nodesMode!=='masked'){ nodesMode='masked'; load(); }
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===nav));
    draw(); return; }

  const top=ev.target.closest('.rule>.top');
  if(top){ const r=top.parentElement;
    openRule=r.classList.contains('open')?-1:+r.dataset.i; draw(); return; }

  if(ev.target.id==='nodes-show'){
    /* Ключ запрашиваем отдельно и только сейчас. */
    const r=await fetch(api('/data?reveal=1'));
    if(r.ok){ D=await r.json(); nodesMode='shown'; draw(); }
    return;
  }

  if(ev.target.id==='nodes-new'){ nodesMode='new'; draw();
    const t=$('#nodes'); if(t) t.focus(); return; }

  if(ev.target.id==='nodes-hide'){ nodesMode='masked'; load(); return; }

  if(ev.target.id==='reshow'){
    ev.preventDefault();
    try { localStorage.removeItem('sf-disclaimer'); } catch(e){}
    gate(); return;
  }

  if(ev.target.id==='newrule'){
    const t=prompt('Куда заворачивать? Имя политики Keenetic либо сетевого интерфейса:',D.policy_name);
    if(!t) return;
    const rules=parseDomains(D.domains);
    rules.push({target:t.trim(),groups:[{name:freeName(rules),on:true,lines:[]}]});
    openRule=rules.length-1;
    D.domains=buildDomains(rules); draw(); return;
  }

  const addg=ev.target.closest('[data-addgrp]');
  if(addg){ const rules=collect();
    rules[+addg.dataset.addgrp].groups.push({name:freeName(rules),on:true,lines:[]});
    D.domains=buildDomains(rules); draw(); return; }

  const sw=ev.target.closest('[data-toggle]');
  if(sw){ const rules=collect();
    const el=sw.closest('.grp');
    const g=rules[+el.dataset.r].groups[+el.dataset.g];
    g.on=!g.on;
    D.domains=buildDomains(rules); draw(); return; }

  const del=ev.target.closest('[data-del]');
  if(del){ const el=del.closest('.grp'), rules=collect();
    rules[+el.dataset.r].groups.splice(+el.dataset.g,1);
    D.domains=buildDomains(rules); draw(); return; }

  if(ev.target.id==='save-rules'){
    D.domains=buildDomains(collect(true));
    return save('domains',D.domains,'m-rules');
  }

  const b=ev.target.closest('[data-save]');
  if(b) return save(b.dataset.save,$('#'+b.dataset.save).value,'m-'+b.dataset.save);
});

/* Плашка при первом входе. Согласие помним в браузере: это отметка
   «прочитал», а не настройка демона, и на роутере ей делать нечего.
   Приватное окно или другой браузер покажут её снова — так и надо. */
function seen(){
  try { return localStorage.getItem('sf-disclaimer') === '1'; }
  catch(e){ return false; }
}

/* Плашка о DNS. Показываем, только когда демон видит DNS-ответы другим
   устройствам, но не этому: тогда утверждение «ходит мимо роутера»
   опирается на наблюдение, а не на догадку. */
function dnsWarn(){
  const el=$('#dns');
  el.className='modal';
  el.hidden=false;
  el.innerHTML=`<div class="box">
    <h3>Устройство не спрашивает роутер</h3>
    <p class="sub">Адрес устройства: ${esc(D.peer||'неизвестен')}</p>
    <div class="fine" style="max-width:none">
      <p>Демон видит DNS-ответы другим устройствам сети, но этому — ни
      одного за последние десять минут. Значит имена оно разрешает мимо
      роутера, и <b>маршрутизация по доменам для него работать не
      будет</b>: адреса брать неоткуда. Подсети в списках при этом
      работают — они не зависят от DNS.</p>

      <p>Что обычно включено:</p>
      <ul>
        <li>в браузере — «Безопасный DNS», «Защищённый DNS», DNS-over-HTTPS;</li>
        <li>в Windows или macOS — DNS прописан вручную вместо получения
        от роутера;</li>
        <li>в Android или iOS — «Частный DNS», «Персональный DNS»,
        Private Relay;</li>
        <li>на самом устройстве работает VPN или прокси.</li>
      </ul>

      <p>Выключи то, что найдёшь, и нажми «Проверить снова»: страница
      сама заставит устройство разрешить случайное имя и посмотрит,
      прошёл ли этот запрос через роутер. Никуда этот запрос не ведёт —
      такого имени не существует.</p>
    </div>
    <div class="bar" style="margin-top:18px">
      <button class="b" id="dns-recheck">Проверить снова</button>
      <button class="b ghost" id="dns-close">Закрыть</button>
    </div>
  </div>`;

  $('#dns-close').onclick=()=>{ el.hidden=true; el.className=''; el.innerHTML=''; dnsShown=2; };

  $('#dns-recheck').onclick=async ev=>{
    const b=ev.target; b.disabled=true; b.textContent='проверяю…';
    await probe();
    el.hidden=true; el.className=''; el.innerHTML='';
    dnsShown=0; await load(1);
  };
}

/* Заставляем устройство спросить имя, чтобы проверка не гадала.
   Берём случайное имя под доменом из собственных списков: такой запрос
   ничего не открывает и никуда не ведёт — он вернёт «нет такого», но
   пройдёт через тот DNS, которым устройство пользуется. Именно это мы и
   хотим увидеть. Без этого «Проверить снова» просто перечитывала бы
   старый ответ. */
async function probe(){
  const host=(D.domains||'').split('\n').map(s=>s.trim())
    .find(s=>s && !/^[[#;]/.test(s) && !/=/.test(s) && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(s));
  if(!host) return;

  const name='sf'+Math.random().toString(36).slice(2,10)+'.'+host.replace(/^[*.=]+/,'');
  try{
    await Promise.race([
      fetch('http://'+name+'/', {mode:'no-cors', cache:'no-store'}).catch(()=>{}),
      new Promise(r=>setTimeout(r,2500))
    ]);
  }catch(e){}
  await new Promise(r=>setTimeout(r,600));
}

function gate(){
  const el=$('#gate');
  el.className='modal';
  el.hidden=false;
  el.innerHTML=`<div class="box">
    <h3>Отказ от ответственности</h3>
    <p class="sub">Прочти перед тем, как настраивать маршрутизацию</p>
    <div class="fine" style="max-width:none">${disclaimer()}</div>
    <button class="b ok" id="accept">Принимаю</button>
  </div>`;
  $('#accept').onclick=()=>{
    try { localStorage.setItem('sf-disclaimer','1'); } catch(e){}
    el.hidden=true; el.className=''; el.innerHTML='';
  };
}

if(!seen()) gate();

load();
setInterval(()=>{ if(!document.querySelector('textarea:focus,input:focus')) load(); },10000);
</script>
