:root{
  --bg:#f2f4f7;--panel:#fff;--card:#fff;--line:#e2e6ec;--soft:#f7f9fb;
  --fg:#1a1f27;--dim:#6b7686;--acc:#0fb0cd;--ok:#12b76a;--bad:#e5484d;--warn:#f59f0b;
}
:root[data-theme=dark]{
  --bg:#0d1014;--panel:#151a21;--card:#1b212a;--line:#28303b;--soft:#12171d;
  --fg:#e8ecf2;--dim:#8b95a5;--acc:#22b8d6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0d1014;--panel:#151a21;--card:#1b212a;--line:#28303b;--soft:#12171d;
    --fg:#e8ecf2;--dim:#8b95a5;--acc:#22b8d6;
  }
}
*{box-sizing:border-box}
/* Свой display в классе перебивает атрибут hidden, и скрытое остаётся
   видимым: полоса сохранения висела на пустом месте. */
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--fg);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}

/* ---- шапка ---- */
header{display:flex;align-items:center;gap:18px;padding:10px 20px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand svg,.brand .mark{width:44px;height:44px;flex:0 0 auto;display:block}
.brand b{font:600 25px/1 Cinzel,"Times New Roman",Georgia,serif;
  color:var(--acc);letter-spacing:.04em}
.brand span{color:var(--dim);font-size:13px;margin-left:2px}
.tabs{display:flex;gap:4px;margin-left:18px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font:inherit;font-size:14.5px;padding:9px 14px;cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.tbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:9px;
  width:38px;height:38px;cursor:pointer;font-size:16px;display:grid;place-items:center;
  text-decoration:none}
.tbtn:hover{color:var(--fg);border-color:var(--acc)}
a.tbtn:hover{color:var(--bad);border-color:var(--bad)}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:26px 22px 40px}
.htop{display:flex;align-items:center;gap:14px;margin-bottom:18px}
h2{margin:0;font-size:22px;font-weight:650}

/* ---- кнопки ---- */
.b{background:var(--acc);color:#04222a;border:0;border-radius:9px;
  padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.b.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.b.ghost:hover{border-color:var(--acc)}
.b.sm{padding:7px 13px;font-size:13.5px}
.b:disabled{opacity:.45;cursor:default}

/* ---- правило ---- */
.rule{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:16px}
.rule>.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rule>.top b{font-size:16px}
.badge{background:var(--soft);border:1px solid var(--line);border-radius:20px;
  padding:3px 11px;color:var(--dim);font-size:12.5px}

/* ---- группа ---- */
.grp{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;
  background:var(--card);overflow:hidden}
.grp.off .gh .nm{color:var(--dim)}
.gh{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.gh .ico{width:26px;height:26px;flex:0 0 auto;border-radius:6px;
  display:grid;place-items:center}
.gh .ico svg{width:22px;height:22px;display:block}
.nm{font-size:15px;font-weight:600;background:none;border:0;color:inherit;
  font-family:inherit;padding:2px 0;min-width:60px;flex:0 1 auto}
.nm:focus{outline:0;border-bottom:1px solid var(--acc)}
.chev{color:var(--dim);transition:transform .15s;flex:0 0 auto}
.grp.open .chev{transform:rotate(180deg)}
.gbody{display:none;padding:0 14px 14px;gap:14px}
.grp.open .gbody{display:grid;grid-template-columns:1fr 300px}
@media(max-width:820px){.grp.open .gbody{grid-template-columns:1fr}}

.ed{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--soft)}
.ed .gut{padding:9px 8px 9px 12px;color:var(--dim);text-align:right;
  font:12.5px/1.6 ui-monospace,Menlo,monospace;user-select:none;overflow:hidden;
  border-right:1px solid var(--line);min-width:38px;
  white-space:pre}   /* иначе номера строк выстраиваются в строку */
.ed textarea{flex:1;min-height:150px;border:0;outline:0;resize:vertical;
  background:none;color:var(--fg);padding:9px 12px;
  font:12.5px/1.6 ui-monospace,Menlo,monospace}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:9px;
  padding:14px;color:var(--dim);font-size:13px;height:fit-content}
.hint b{display:flex;align-items:center;gap:8px;color:var(--fg);
  font-size:13.5px;margin-bottom:7px}
.hint b svg{width:18px;height:18px;flex:0 0 auto}
.hint code{background:var(--card)}
.icon{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;
  padding:3px 6px;border-radius:6px}
.icon:hover{color:var(--bad);background:var(--soft)}

/* ---- переключатель ---- */
.sw{flex:0 0 auto;width:40px;height:22px;border-radius:11px;border:0;padding:0;
  background:var(--line);cursor:pointer;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:transform .15s;
  box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(18px)}

/* ---- карточки прочих разделов ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:17px 19px;margin-bottom:16px}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:0 0 12px;color:var(--dim);font-size:14px;line-height:1.7}
label{display:block;color:var(--dim);font-size:12.5px;margin:12px 0 6px}
textarea.wide{width:100%;min-height:130px;background:var(--soft);color:var(--fg);
  border:1px solid var(--line);border-radius:9px;padding:10px;
  font:12.5px/1.6 ui-monospace,Menlo,monospace;resize:vertical}
pre{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:12px;
  overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,monospace;margin:0;color:var(--dim)}
code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:12.5px}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--dim)}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:0 26px}
@media(max-width:820px){.rows{grid-template-columns:1fr}main{padding:18px 14px 40px}
  .tabs{margin-left:0}header{flex-wrap:wrap;gap:10px}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--dim)}

/* ---- полоса сохранения ---- */
.save{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;gap:14px;
  background:var(--panel);border-top:1px solid var(--line);padding:14px 22px;
  box-shadow:0 -6px 24px rgba(0,0,0,.10)}
.save .t{font-weight:600}
.save .s{color:var(--dim);font-size:13px}

/* ---- подвал ---- */
footer{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;
  padding:14px 22px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:12.5px}
footer b{color:var(--fg);font-weight:600}
footer a,footer .ver{display:inline-flex;align-items:center;gap:7px;color:var(--dim);
  text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 13px}
footer a:hover{color:var(--fg);border-color:var(--acc)}
footer .ver{line-height:1.3;text-align:center;display:block}

/* ---- окна ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;
  display:grid;place-items:center;padding:22px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:min(720px,100%);max-height:86vh;overflow:auto;padding:24px 28px 22px;
  box-shadow:0 18px 60px rgba(0,0,0,.35)}
.modal .box.warn{border-top:4px solid var(--warn)}
.modal h3{margin:0 0 4px;text-align:center;font-size:19px}
.modal .sub{text-align:center;color:var(--dim);font-size:13px;margin:0 0 18px}
.fine{max-width:none}
.fine p,.fine ul{color:var(--fg);font-size:14.5px;line-height:1.8;margin:0 0 14px}
.fine ul{padding-left:22px}.fine li{margin-bottom:8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  font:inherit;color:inherit;text-align:left}
.pick:hover{border-color:var(--acc)}
.pick svg{width:22px;height:22px;flex:0 0 auto}
.pick i{font-style:normal;color:var(--dim);font-size:12px;display:block}
</style>

const KEYS=[['yt',['youtube','ютуб','ютьюб']],['dc',['discord','дискорд']],
 ['tg',['telegram','телеграм']],['wa',['whatsapp','ватсап','вацап']],
 ['fb',['facebook','фейсбук','фб']],['ig',['instagram','инстаграм','инста']],
 ['tt',['tiktok','тикток']],['ai',['нейросет','openai','chatgpt','claude','gemini','ai']],
 ['nf',['netflix','нетфликс']],['cv',['canva','канва']],['fg',['figma','фигма']],
 ['rb',['roblox','роблокс']],['st',['steam','стим']]];

function iconFor(name){
  const n=String(name||'').toLowerCase();
  for(const [k,words] of KEYS) if(words.some(w=>n.includes(w))) return ICONS[k];
  return ICONS.www;
}

/* ---- разбор и сборка списка ---- */
function parseDomains(text){
  const groups=[]; let g=null;
  for(const raw of String(text).split('\n')){
    const s=raw.trim();
    if(!s||s[0]==='#'||s[0]===';') continue;
    const h=s.match(/^\[(.+)\]$/);
    if(h){ g={name:h[1].trim(),target:'',on:true,lines:[]}; groups.push(g); continue; }
    const kv=s.match(/^interface\s*=\s*(.+)$/i);
    if(kv){ if(g) g.target=kv[1].trim(); continue; }
    const en=s.match(/^enabled\s*=\s*(.+)$/i);
    if(en){ if(g) g.on=!/^(no|off|false|0)$/i.test(en[1].trim()); continue; }
    if(g) g.lines.push(s);
  }
  const rules=[];
  for(const x of groups){
    let r=rules.find(r=>r.target===x.target);
    if(!r){ r={target:x.target,groups:[]}; rules.push(r); }
    r.groups.push(x);
  }
  return rules;
}

function buildDomains(rules){
  const out=[];
  for(const r of rules) for(const g of r.groups){
    out.push('['+g.name+']','interface = '+r.target);
    if(g.on===false) out.push('enabled = no');
    out.push(...g.lines,'');
  }
  return out.join('\n');
}

function collect(drop){
  const rules=parseDomains(D.domains);
  document.querySelectorAll('.grp').forEach(el=>{
    const r=+el.dataset.r, g=+el.dataset.g;
    if(!rules[r]||!rules[r].groups[g]) return;
    const t=rules[r].groups[g];
    t.name=el.querySelector('[data-name]').value.trim()||'без имени';
    t.on=el.querySelector('[data-toggle]').classList.contains('on');
    t.lines=el.querySelector('[data-lines]').value.split('\n')
      .map(s=>s.trim()).filter(Boolean);
  });
  if(drop) for(const r of rules) r.groups=r.groups.filter(g=>g.lines.length);
  return rules.filter(r=>r.groups.length);
}

function sync(){ D.domains=buildDomains(collect()); }
function touch(){ dirty=true; $('#save').hidden=false; }

const plural=(n,a,b,c)=>{const m=n%100,k=n%10;
  return n+' '+(m>=11&&m<=14?c:k===1?a:k>=2&&k<=4?b:c);};

function gutter(text){
  const n=Math.max(1,String(text).split('\n').length);
  let s=''; for(let i=1;i<=n;i++) s+=i+'\n';
  return s;
}

  try{
    const r=await fetch(api('/data'+(probed?'?probed=1':'')));
    if(!r.ok) throw new Error('код '+r.status);
    D=await r.json();
    dirty=false;

  }catch(e){
    $('#view').innerHTML='<p style="color:var(--bad)">Нет связи с демоном: '+esc(e.message)+'</p>';
  }
}

async function save(what,text,msgId){
  /* Пустое имя раньше давало querySelector('#') — исключение до
     отправки. Кнопка «Сохранить» тогда не делала ничего, а страница
     выглядела так, будто сохранила. */
  const m=msgId?$('#'+msgId):null;
  if(m){ m.className='msg'; m.textContent='сохраняю…'; }
  try{
    const r=await fetch(api('/save?what='+what),{method:'POST',body:text});
    const t=(await r.text()).trim();
    if(m){ m.className=r.ok?'msg ok':'msg bad'; m.textContent=t||(r.ok?'готово':'ошибка'); }
    if(r.ok){ if(what==='nodes') nodesMode='masked'; dirty=false; setTimeout(load,1500); }
    return r.ok;
  }catch(e){ if(m){ m.className='msg bad'; m.textContent=e.message; } return false; }
}

function picker(ruleIdx){
  const el=$('#pick');
  el.className='modal'; el.hidden=false;
  el.innerHTML=`<div class="box"><h3>Новая группа</h3>
    <p class="sub">Готовый набор доменов или пустая группа</p>
    <div class="picks">
      ${PRESETS.map((p,i)=>`<button class="pick" data-preset="${i}">
         ${ICONS[p.icon]||ICONS.www}<span>${esc(p.name)}
         <i>${plural(p.lines.length,'запись','записи','записей')}</i></span></button>`).join('')}
      <button class="pick" data-preset="-1">${ICONS.www}<span>Пустая<i>своя</i></span></button>
    </div>
    <div class="bar" style="margin-top:18px">
      <button class="b ghost" id="pick-close">Отмена</button></div></div>`;

  const close=()=>{ el.hidden=true; el.className=''; el.innerHTML=''; };
  $('#pick-close').onclick=close;

  el.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.preset;
    const rules=collect();
    const used=new Set();
    for(const r of rules) for(const g of r.groups) used.add(g.name.toLowerCase());

    let name, lines;
    if(n<0){ let i=1; while(used.has(('группа '+i).toLowerCase())) i++;
             name='группа '+i; lines=[]; }
    else   { const p=PRESETS[n];
             name=p.name; lines=p.lines.slice();
             if(used.has(name.toLowerCase())){
               let i=2; while(used.has((name+' '+i).toLowerCase())) i++;
               name=name+' '+i;
             } }

    rules[ruleIdx].groups.push({name,on:true,lines});
    open[ruleIdx+'.'+(rules[ruleIdx].groups.length-1)]=1;
    D.domains=buildDomains(rules);
    close(); touch(); draw();
  });
}

/* Заставляем устройство разрешить случайное имя под доменом из своих же
   списков: без этого «Проверить снова» перечитывала бы прежний ответ. */
async function probe(){
  const host=(D.domains||'').split('\n').map(s=>s.trim())
    .find(s=>s && !/^[[#;]/.test(s) && !/=/.test(s) && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(s));
  if(!host) return;
  const name='sf'+Math.random().toString(36).slice(2,10)+'.'+host.replace(/^[*.=]+/,'');
  try{ await Promise.race([
    fetch('http://'+name+'/',{mode:'no-cors',cache:'no-store'}).catch(()=>{}),
    new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  await new Promise(r=>setTimeout(r,600));
}

  el.innerHTML=`<div class="box warn"><h3>Устройство не спрашивает роутер</h3>
    <p class="sub">Адрес устройства: ${esc(D.peer||'неизвестен')}</p>
    <div class="fine">
      <p>Демон видит DNS-ответы другим устройствам сети, но этому — ни одного.
      Значит имена оно разрешает мимо роутера, и <b>маршрутизация по доменам
      для него работать не будет</b>: адреса брать неоткуда. Подсети в списках
      при этом работают — они не зависят от DNS.</p>
      <p>Что обычно включено:</p>
      <ul>
        <li>в браузере — «Безопасный DNS», «Защищённый DNS», DNS-over-HTTPS;</li>
        <li>в Windows или macOS — DNS прописан вручную вместо получения от роутера;</li>
        <li>в Android или iOS — «Частный DNS», «Персональный DNS», Private Relay;</li>
        <li>на самом устройстве работает VPN или прокси.</li>
      </ul>
      <p>Выключи то, что найдёшь, и нажми «Проверить снова»: страница сама
      заставит устройство разрешить случайное имя и посмотрит, прошёл ли
      запрос через роутер. Никуда он не ведёт — такого имени не существует.</p>
    </div>
    <div class="bar" style="margin-top:18px">
      <button class="b" id="dns-recheck">Проверить снова</button>
      <button class="b ghost" id="dns-close">Закрыть</button></div></div>`;

  const hide=()=>{ el.hidden=true; el.className=''; el.innerHTML=''; };
  $('#dns-close').onclick=()=>{ hide(); dnsShown=2; };
  $('#dns-recheck').onclick=async ev=>{
    ev.target.disabled=true; ev.target.textContent='проверяю…';
    await probe(); hide(); dnsShown=0; await load(1);
  };
}

/* ---- тема ---- */
try{ document.documentElement.dataset.theme=localStorage.getItem('sf-theme')||''; }catch(e){}
$('#theme').onclick=()=>{
  const cur=document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const t=cur==='light'?'dark':'light';
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('sf-theme',t); }catch(e){}
};

/* ---- события ---- */
document.addEventListener('input',ev=>{
  const ta=ev.target.closest('[data-lines]');
  if(ta){ const g=ta.parentElement.querySelector('.gut');
          if(g) g.textContent=gutter(ta.value); }
  if(ev.target.closest('.grp')) touch();
});

document.addEventListener('scroll',ev=>{
  const ta=ev.target.closest && ev.target.closest('[data-lines]');
  if(ta){ const g=ta.parentElement.querySelector('.gut');
          if(g) g.scrollTop=ta.scrollTop; }
},true);

document.addEventListener('click',async ev=>{
  const nav=ev.target.closest('.tabs button');
  if(nav){ tab=nav.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===nav));
    if(nodesMode!=='masked') nodesMode='masked';
    draw(); return; }

  if(ev.target.closest('.nm')||ev.target.closest('[data-toggle]')===null&&ev.target.closest('.icon')) {}

  const sw=ev.target.closest('[data-toggle]');
  if(sw){ const el=sw.closest('.grp'), rules=collect();
    const g=rules[+el.dataset.r].groups[+el.dataset.g];
    g.on=!g.on; D.domains=buildDomains(rules); touch(); draw(); return; }

  const del=ev.target.closest('[data-del]');
  if(del){ const el=del.closest('.grp'), rules=collect();
    rules[+el.dataset.r].groups.splice(+el.dataset.g,1);
    D.domains=buildDomains(rules); touch(); draw(); return; }

  const gh=ev.target.closest('.gh');
  if(gh && !ev.target.closest('.nm')){
    const el=gh.parentElement, id=el.dataset.id;
    sync(); open[id]=!open[id]; draw(); return; }

  const addg=ev.target.closest('[data-addgrp]');
  if(addg){ picker(+addg.dataset.addgrp); return; }

  if(ev.target.id==='newrule'){
    const t=prompt('Куда заворачивать? Имя политики Keenetic либо интерфейса:',
                   D.policy_name);
    if(!t) return;
    const rules=collect();
    rules.push({target:t.trim(),groups:[]});
    D.domains=buildDomains(rules);
    touch(); draw(); picker(rules.length-1); return; }

  if(ev.target.id==='apply'){
    const btn=ev.target; btn.disabled=true;
    const note=$('#save-note'); note.textContent='сохраняю…';
    D.domains=buildDomains(collect(true));
    const ok=await save('domains',D.domains,null);
    btn.disabled=false;
    if(ok){ dirty=false; $('#save').hidden=true; note.textContent='Не забывай сохранять.'; }
    else   { note.textContent='не удалось сохранить'; }
    return; }

  if(ev.target.id==='undo'){ dirty=false; $('#save').hidden=true; load(); return; }

  if(ev.target.id==='nodes-show'){
    const r=await fetch(api('/data?reveal=1'));
    if(r.ok){ D=await r.json(); nodesMode='shown'; draw(); } return; }
  if(ev.target.id==='nodes-new'){ nodesMode='new'; draw(); $('#nodes')?.focus(); return; }
  if(ev.target.id==='nodes-hide'){ nodesMode='masked'; load(); return; }

  if(ev.target.id==='reshow'){ ev.preventDefault();
    try{ localStorage.removeItem('sf-disclaimer'); }catch(e){}
    gate(); return; }

  const b=ev.target.closest('[data-save]');
  if(b) return save(b.dataset.save,$('#'+b.dataset.save).value,'m-'+b.dataset.save);
});

addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

if(!seen()) gate();
load();
setInterval(()=>{ if(!dirty && !document.querySelector('textarea:focus,input:focus')) load(); },10000);
</script>
