:root{
  --bg:#0b0f14;--side:#0d1218;--panel:#131a22;--card:#161e27;--line:#222c38;
  --soft:#0f151c;--fg:#e9eef5;--dim:#8b95a5;--acc:#22c8e6;--acc-soft:#22c8e61f;
  --ok:#3ddc84;--bad:#ff5f5f;--warn:#f5b23d;
}
:root[data-theme=light]{
  --bg:#f4f6f9;--side:#fff;--panel:#fff;--card:#fff;--line:#e3e8ee;
  --soft:#f7f9fb;--fg:#161c24;--dim:#66707e;--acc:#0d9fbc;--acc-soft:#0d9fbc17;
  --ok:#0f9d58;--bad:#d93a3a;--warn:#c98118;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#f4f6f9;--side:#fff;--panel:#fff;--card:#fff;--line:#e3e8ee;
    --soft:#f7f9fb;--fg:#161c24;--dim:#66707e;--acc:#0d9fbc;--acc-soft:#0d9fbc17;
    --ok:#0f9d58;--bad:#d93a3a;--warn:#c98118;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sp{flex:1}   /* распорка: объявлена один раз для всех */
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
svg{display:block}

.app{display:flex;min-height:100vh}

/* ---- боковая панель ---- */
aside{width:270px;flex:0 0 auto;background:var(--side);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:20px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;margin:0 6px 26px;
  text-decoration:none;color:inherit}
.brand svg,.brand .mark{width:46px;height:46px;flex:0 0 auto}
.brand b{display:block;font:600 21px/1.1 Cinzel,"Times New Roman",Georgia,serif;
  color:var(--acc);letter-spacing:.03em}
.brand i{font-style:normal;color:var(--dim);font-size:12.5px}
aside nav{display:flex;flex-direction:column;gap:4px}
aside nav button{display:flex;align-items:center;gap:13px;width:100%;
  background:none;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;
  color:var(--dim);font:inherit;font-size:15px;text-align:left}
aside nav button svg{width:21px;height:21px;flex:0 0 auto}
aside nav button:hover{color:var(--fg);background:var(--panel)}
aside nav button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.grow{flex:1}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;
  border:0;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--dim);
  font:inherit;font-size:14px;text-decoration:none}
.srow svg{width:19px;height:19px;flex:0 0 auto}
.srow:hover{color:var(--fg);background:var(--panel)}
.srow .sp{flex:1}
.sep{height:1px;background:var(--line);margin:14px 8px}
.core{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  border:1px solid var(--bad);color:var(--bad);background:none;border-radius:12px;
  padding:13px;cursor:pointer;font:inherit;font-size:14.5px;font-weight:600;
  text-decoration:none}
.core:hover{background:#ff5f5f14}
.core svg{width:19px;height:19px}

/* ---- правая часть ---- */
.side2{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:flex-end;gap:12px;
  padding:18px 30px 0}
.pill{display:inline-flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:10px 16px;
  font-size:14px;color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.tbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:12px;width:44px;height:44px;cursor:pointer;
  display:grid;place-items:center}
.tbtn svg{width:20px;height:20px}
.tbtn:hover{color:var(--acc);border-color:var(--acc)}
main{padding:22px 30px 40px;flex:1;min-width:0}

h2{margin:0;font-size:27px;font-weight:700;letter-spacing:-.01em}
.sub{margin:5px 0 0;color:var(--dim);font-size:14.5px}
.htop{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.htop .sp{flex:1}

/* ---- кнопки ---- */
.b{background:var(--acc);color:#04222a;border:0;border-radius:11px;
  padding:12px 20px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:9px}
.b.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.b.ghost:hover{border-color:var(--acc)}
.b.out{background:none;color:var(--acc);border:1px solid var(--acc)}
.b.sm{padding:9px 15px;font-size:13.5px;border-radius:10px}
.b:disabled{opacity:.5;cursor:default}
.b svg{width:17px;height:17px}

/* ---- поиск ---- */
.search{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 15px;
  margin-bottom:20px;max-width:520px}
.search svg{width:18px;height:18px;color:var(--dim)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--fg);
  font:inherit;font-size:14.5px}

/* ---- карточки ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;margin-bottom:16px;min-width:0}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0 0 12px;color:var(--dim);font-size:14px;line-height:1.7}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:20px 22px;margin-bottom:18px}
.rule>.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.rule>.top b{font-size:19px}
.badge{background:var(--soft);border:1px solid var(--line);border-radius:20px;
  padding:4px 12px;color:var(--dim);font-size:12.5px;white-space:nowrap}
.badge.ok{color:var(--ok);border-color:#3ddc8455}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;display:flex;flex-direction:column;min-width:0}
.g.off{opacity:.55}
.g .gh{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
.g .ico{width:38px;height:38px;flex:0 0 auto;border-radius:11px;background:var(--soft);
  display:grid;place-items:center}
.g .ico svg{width:23px;height:23px}
.g .nm{font-size:17px;font-weight:650;background:none;border:0;color:inherit;
  font-family:inherit;padding:0;width:100%;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.g .nm:focus{outline:0;border-bottom:1px solid var(--acc)}
.g .cnt{color:var(--dim);font-size:13px;margin-top:2px}
/* Окно списка невысокое и прокручивается. Раньше стояло flex:1, а у
   элемента флекса min-height по умолчанию auto — высота 150px не
   держала, и карточка вытягивалась под все записи: при полутора сотнях
   доменов это полотно во весь экран. */
.g .list{background:var(--soft);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font:13px/1.85 ui-monospace,Menlo,monospace;color:var(--fg);
  height:170px;min-height:0;flex:none;overflow:auto;white-space:pre}
.g textarea{background:var(--soft);border:1px solid var(--acc);border-radius:10px;
  padding:11px 13px;font:13px/1.85 ui-monospace,Menlo,monospace;color:var(--fg);
  height:170px;min-height:0;flex:none;resize:vertical;outline:0;width:100%}
.g .gf{display:flex;align-items:center;gap:10px;margin-top:13px;
  border-top:1px solid var(--line);padding-top:12px}
.lnk{display:inline-flex;align-items:center;gap:8px;background:none;border:0;
  color:var(--acc);font:inherit;font-size:14px;cursor:pointer;padding:0}
.lnk svg{width:16px;height:16px}
.lnk.d{color:var(--bad)}
.sw{flex:0 0 auto;width:44px;height:24px;border-radius:12px;border:0;padding:0;
  background:var(--line);cursor:pointer;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(20px)}
.note{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13.5px;
  margin-top:16px}
.note svg{width:17px;height:17px;flex:0 0 auto}

/* ---- плитки состояния ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:18px;display:flex;align-items:flex-start;gap:14px}
.tile .ic{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--soft);
  display:grid;place-items:center;color:var(--acc)}
.tile .ic svg{width:22px;height:22px}
.tile .t{color:var(--dim);font-size:13.5px}
.tile .v{font-size:24px;font-weight:650;margin-top:2px}
.tile .v.sm{font-size:16px}
/* min-width:0 обязателен: элемент сетки по умолчанию не уже своего
   содержимого, и одна длинная ссылка выносила соседнюю колонку за
   пределы экрана. */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.two>*{min-width:0}
@media(max-width:1040px){.two{grid-template-columns:1fr}}

.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--dim)}

/* ---- сворачиваемые ---- */
.fold{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  margin-bottom:14px;overflow:hidden}
.fold>button{display:flex;align-items:center;width:100%;background:none;border:0;
  padding:17px 20px;cursor:pointer;color:var(--fg);font:inherit;font-size:16px;
  font-weight:600;text-align:left}
.fold>button .sp{flex:1}
.fold .chev{color:var(--dim);transition:transform .15s}
.fold.open .chev{transform:rotate(180deg)}
.fold .body{display:none;padding:0 20px 20px}
.fold.open .body{display:block}

/* ---- цепочка «как это работает» ---- */
.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flow span{background:var(--soft);border:1px solid var(--line);border-radius:10px;
  padding:11px 18px;font-size:14.5px}
.flow i{color:var(--dim);font-style:normal}

label{display:block;color:var(--dim);font-size:13px;margin:14px 0 7px}
.field{display:flex;align-items:center;gap:10px;background:var(--soft);
  border:1px solid var(--line);border-radius:11px;padding:4px 6px 4px 14px;
  min-width:0}
.field code{flex:1;min-width:0;font:13.5px/2.4 ui-monospace,Menlo,monospace;
  color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:none;padding:0}
textarea.wide{width:100%;min-height:130px;background:var(--soft);color:var(--fg);
  border:1px solid var(--line);border-radius:11px;padding:12px;
  font:13px/1.7 ui-monospace,Menlo,monospace;resize:vertical;outline:0}
pre{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:14px;
  overflow-x:auto;font:12.5px/1.7 ui-monospace,Menlo,monospace;margin:0;color:var(--dim)}
code{background:var(--soft);padding:2px 7px;border-radius:6px;font-size:13px}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--dim)}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

/* ---- строка состояния справа ---- */
.stat{display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;
  width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.stat:hover{border-color:var(--acc)}
.stat .ic{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--soft);
  display:grid;place-items:center;color:var(--fg)}
.stat .ic svg{width:23px;height:23px}
.stat .t{font-size:16.5px;font-weight:600}
.stat .s{display:flex;align-items:center;gap:8px;color:var(--dim);
  font-size:14px;margin-top:4px}
.stat .s svg{width:16px;height:16px}
.stat .chev{color:var(--dim)}

/* ---- полоса сохранения ---- */
.save{position:sticky;bottom:18px;z-index:30;display:flex;align-items:center;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:16px 20px;margin:0 30px 18px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
@media(max-width:880px){.save{margin:0 14px 14px}}
.save .t{display:flex;align-items:center;gap:10px;font-weight:600}

/* ---- окна ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;
  display:grid;place-items:center;padding:22px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  width:min(740px,100%);max-height:86vh;overflow:auto;padding:26px 28px 22px;
  box-shadow:0 20px 70px rgba(0,0,0,.5)}
.modal .box.warn{border-top:4px solid var(--warn)}
.modal h3{margin:0 0 6px;text-align:center;font-size:20px}
.modal .ctr{text-align:center;color:var(--dim);font-size:13.5px;margin:0 0 20px}
.fine p,.fine ul{color:var(--fg);font-size:14.5px;line-height:1.8;margin:0 0 14px}
.fine ul{padding-left:22px}.fine li{margin-bottom:8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.pick{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  font:inherit;color:inherit;text-align:left}
.pick:hover{border-color:var(--acc)}
.pick svg{width:23px;height:23px;flex:0 0 auto}
.pick i{font-style:normal;color:var(--dim);font-size:12px;display:block}
.pick.sel{border-color:var(--acc);background:var(--acc-soft)}
.pick .box{width:20px;height:20px;flex:0 0 auto;border:1px solid var(--line);
  border-radius:6px;display:grid;place-items:center;color:var(--acc);
  font-size:13px;font-weight:700}
.pick.sel .box{border-color:var(--acc)}

@media(max-width:880px){
  .app{flex-direction:column}
  aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;
    align-items:center;gap:8px;padding:12px 14px}
  .brand{margin:0 8px 0 0}
  .brand svg,.brand .mark{width:38px;height:38px}
  .brand b{font-size:18px}
  aside nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  /* Кнопки во всю ширину раскладывали панель в столбец. */
  aside nav button,.srow{width:auto;padding:9px 13px;font-size:14px}
  .srow .sp{display:none}
  .grow,.sep{display:none}
  .core{width:auto;padding:9px 14px;font-size:14px}
  main{padding:16px 14px 34px}
  header{padding:12px 14px 0}
  h2{font-size:22px}
  /* Заголовок раздела обязан переноситься, иначе кнопка уезжает. */
  .htop{flex-wrap:wrap}
  .htop .sp{display:none}
}
</style>

<div class="app">
  <aside>
    <a class="brand" href="/">
      <!--ЛОГОТИП-->
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path fill="var(--acc)" d="M10 6l9 10h26l9-10 3 18c0 6-3 11-8 15l-9 7-8 8-8-8-9-7c-5-4-8-9-8-15z"/>
        <path fill="var(--bg)" d="M22 27c0-3 3-5 7-5h6v4h-8v3h6c3 0 5 2 5 5s-2 5-5 5h-8v-4h8v-3h-5c-4 0-6-2-6-5zm18-5h11v4h-7v3h6v4h-6v7h-4z"/>
      </svg>
      <!--/ЛОГОТИП-->
      <span><b>Shadow&nbsp;Fox</b><i id="ver"></i></span>
    </a>

    <nav>
      <button data-tab="rules" class="on"></button>
      <button data-tab="conn"></button>
      <button data-tab="info"></button>
    </nav>

    <div class="grow"></div>
    <div class="sep"></div>
    <button class="srow" id="theme"></button>
    <a class="srow" href="https://github.com/SkunkBG/shadowfox"
       target="_blank" rel="noopener" id="gh"></a>
    <div class="sep"></div>
    <a class="core" href="/logout" id="exit"></a>
  </aside>

function iconFor(name){
  const n=String(name||'').toLowerCase();
  for(const [k,w] of KEYS) if(w.some(x=>n.includes(x))) return ICONS[k];
  return ICONS.www;
}

/* ---- разбор и сборка ---- */
function parseDomains(text){
  const groups=[]; let g=null;
  for(const raw of String(text).split('\n')){
    const s=raw.trim();
    if(!s||s[0]==='#'||s[0]===';') continue;
    const h=s.match(/^\[(.+)\]$/);
    if(h){ g={name:h[1].trim(),target:'',on:true,lines:[]}; groups.push(g); continue; }
    const kv=s.match(/^interface\s*=\s*(.+)$/i);
    if(kv){ if(g) g.target=kv[1].trim(); continue; }
    const en=s.match(/^enabled\s*=\s*(.+)$/i);
    if(en){ if(g) g.on=!/^(no|off|false|0)$/i.test(en[1].trim()); continue; }
    if(g) g.lines.push(s);
  }
  const rules=[];
  for(const x of groups){
    let r=rules.find(r=>r.target===x.target);
    if(!r){ r={target:x.target,groups:[]}; rules.push(r); }
    r.groups.push(x);
  }
  return rules;
}

function buildDomains(rules){
  const out=[];
  for(const r of rules) for(const g of r.groups){
    out.push('['+g.name+']','interface = '+r.target);
    if(g.on===false) out.push('enabled = no');
    out.push(...g.lines,'');
  }
  return out.join('\n');
}

function collect(drop){
  const rules=parseDomains(D.domains);
  document.querySelectorAll('.g').forEach(el=>{
    const r=+el.dataset.r, g=+el.dataset.g;
    if(!rules[r]||!rules[r].groups[g]) return;
    const t=rules[r].groups[g];
    const nm=el.querySelector('[data-name]'), ta=el.querySelector('[data-lines]');
    if(nm) t.name=nm.value.trim()||'без имени';
    if(ta) t.lines=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    t.on=el.querySelector('[data-toggle]').classList.contains('on');
  });
  if(drop) for(const r of rules) r.groups=r.groups.filter(g=>g.lines.length);
  return rules.filter(r=>r.groups.length);
}

/* ---- раздел «Правила» ---- */
function matches(g){
  if(!query) return true;
  const q=query.toLowerCase();
  return g.name.toLowerCase().includes(q) ||
         g.lines.some(l=>l.toLowerCase().includes(q));
}

  const head=`<div class="htop">

  if(!rules.length)
    return head+`<div class="card"><h3>Правил пока нет</h3>
      <p>Правило — это цель, куда заворачивается трафик: политика Keenetic либо

      по одной записи в строке.</p></div>`;

  const body = rules.map((r,i)=>{
    const shown=r.groups.map((g,k)=>({g,k})).filter(x=>matches(x.g));
    if(query && !shown.length) return '';
    return `<div class="rule">
      <div class="top"><b>${esc(r.target||'без цели')}</b>
        <span class="badge">${plural(r.groups.length,'группа','группы','групп')}</span>
        <div class="sp"></div>
        <button class="b sm" data-addgrp="${i}">${UI.plus}Группа</button></div>
      <div class="grid">${shown.map(({g,k})=>{
        const id=i+'.'+k, ed=!!edit[id];
        return `<div class="g ${g.on===false?'off':''}" data-r="${i}" data-g="${k}" data-id="${id}">
          <div class="gh">
            <span class="ico">${iconFor(g.name)}</span>
            <div style="flex:1;min-width:0">
              ${ed?`<input class="nm" value="${esc(g.name)}" data-name>`
                  :`<div class="nm">${esc(g.name)}</div>`}

            </div>
            <button class="sw ${g.on===false?'':'on'}" data-toggle
              title="${g.on===false?'Включить':'Выключить'}"></button>

          ${ed?`<textarea data-lines spellcheck="false"
                  placeholder="example.com&#10;104.244.42.0/24">${esc(g.lines.join('\n'))}</textarea>`
              :`<div class="list">${esc(g.lines.join('\n'))||'<span style="color:var(--dim)">пусто</span>'}</div>`}

            <button class="lnk" data-edit>${ed?UI.done+'Готово':UI.pen+'Редактировать'}</button>

/* Форма команд взята из running-config настоящего роутера, а не
   придумана: серверы там записаны ровно так. */
const DNSSETS=[
  {key:'cf',    name:'Cloudflare', cmds:[
    'dns-proxy tls upstream 1.1.1.1 sni cloudflare-dns.com',
    'dns-proxy tls upstream 1.0.0.1 sni cloudflare-dns.com']},
  {key:'google',name:'Google', cmds:[
    'dns-proxy tls upstream 8.8.8.8 sni dns.google',
    'dns-proxy tls upstream 8.8.4.4 sni dns.google']},
  {key:'quad9', name:'Quad9', cmds:[
    'dns-proxy tls upstream 9.9.9.9 sni dns.quad9.net',
    'dns-proxy tls upstream 149.112.112.112 sni dns.quad9.net']}
];
let dnsPick={cf:1,google:0,quad9:1}, dnsIsp=1;

function dnsCmds(){
  const c=[];
  for(const s of DNSSETS) if(dnsPick[s.key]) c.push(...s.cmds);
  const isp=(dnsInfo && dnsInfo.ok && dnsIsp) ? (dnsInfo.isp||[]) : [];
  for(const i of isp) c.push('interface '+i+' ip no name-servers',
                             'interface '+i+' ipv6 no name-servers');
  if(!c.length) return '';
  c.push('service dns-proxy','system configuration save');
  return c.map(x=>`ndmc -c "${x}"`).join('\n');
}

/* Настройки DNS спрашиваем отдельно и только когда открыт этот раздел:
   для них демон запускает ndmc, и делать это каждые десять секунд ради
   строчки в карточке незачем. Ответ храним: иначе перерисовка возвращала
   бы надпись «читаю» и повторный запрос уже не шёл. */
/* Что известно про провайдерский DNS. Отключаем только те интерфейсы,
   где он ещё включён, и показываем их поимённо: команда меняет
   настройки роутера, и человек должен видеть, чего именно она коснётся. */
function dnsIspBox(){
  if(!dnsInfo || !dnsInfo.ok) return '';
  const isp=dnsInfo.isp||[];
  if(!isp.length)
    return `<div class="note" style="margin:0">${UI.ok}Провайдерский DNS уже
      отключён на всех внешних подключениях</div>`;
  return `<div class="note" style="margin:0 0 10px">${UI.i}Ещё берут DNS у
      провайдера: <b>${isp.map(esc).join(', ')}</b></div>
    <button class="pick ${dnsIsp?'sel':''}" data-dnsisp style="max-width:340px">
      <span class="box">${dnsIsp?'✓':''}</span>
      <span>Отключить провайдерский DNS<i>на этих подключениях</i></span></button>`;
}

function dnsBox(){
  if(!dnsInfo) return `<div class="note">${UI.i}читаю настройки роутера…</div>`;
  if(dnsInfo.report)
    return '<label style="margin-top:0">Что выполнено</label><pre>'+
           esc(dnsInfo.report)+'</pre>';
  if(dnsInfo.servers && dnsInfo.servers.length)
    return '<label style="margin-top:0">Сейчас у роутера</label><pre>'+
           dnsInfo.servers.map(esc).join('\n')+'</pre>';
  return `<div class="note">${UI.i}Не прочитать настройки DNS роутера`+
         (dnsInfo.why?' — '+esc(dnsInfo.why):'')+'</div>';
}

async function loadDns(){
  try{
    const r=await fetch(api('/dns'));
    dnsInfo=await r.json();
  }catch(e){ dnsInfo={ok:false,why:e.message}; }
  const box=$('#dnsbox'); if(box) box.innerHTML=dnsBox();
}

/* Раз в десять секунд меняются только счётчики, а перерисовка заменяла
   всю разметку целиком — отсюда постоянное дёрганье и потеря прокрутки.
   Сравниваем то, от чего зависит сама разметка; если оно прежнее, правим
   только числа. */
function sig(){
  return JSON.stringify([D.domains,D.nodes,D.nodes_shown,D.xray_bin,D.proxy_ready,
    D.policy_ready,D.have_link,D.model,D.osver,D.version,D.dns,D.capture,D.iface,
    D.rules,D.socks_port,D.policy_name,D.proxy_name,D.xray_pid>0]);
}

function live(){
  document.querySelectorAll('[data-live]').forEach(el=>{
    const v=D[el.dataset.live];
    if(v!==undefined && v!==null) el.textContent=v;
  });
}

async function load(probed,quiet){
  try{
    const r=await fetch(api('/data'+(probed?'?probed=1':'')));
    if(!r.ok) throw new Error('код '+r.status);
    const was = D ? sig() : null;
    D=await r.json();

    /* Тихое обновление не трогает разметку, если она не изменилась:
       иначе пропадает выделение, прокрутка и открытые разделы. */
    if(quiet && was!==null && was===sig()){ chrome(); live(); return; }

    dirty=false; edit={};
    draw();
    const msg=$('#m-rules'); if(msg) msg.textContent='';
    if(D.dns==='bypass' && !dnsShown && $('#gate').hidden){ dnsShown=1; dnsWarn(); }
  }catch(e){
    $('#view').innerHTML='<div class="card"><p style="color:var(--bad)">'+
      'Нет связи с демоном: '+esc(e.message)+'</p></div>';
  }
}

async function save(what,text,msgId){
  const m=msgId?$('#'+msgId):null;
  if(m){ m.className='msg'; m.textContent='сохраняю…'; }
  try{
    const r=await fetch(api('/save?what='+what),{method:'POST',body:text});
    const t=(await r.text()).trim();
    if(m){ m.className=r.ok?'msg ok':'msg bad'; m.textContent=t||(r.ok?'готово':'ошибка'); }
    if(r.ok){ if(what==='nodes') nodesMode='masked'; dirty=false; setTimeout(load,1500); }
    return r.ok;
  }catch(e){ if(m){ m.className='msg bad'; m.textContent=e.message; } return false; }
}

function picker(ruleIdx){
  const el=$('#pick');
  el.className='modal'; el.hidden=false;
  el.innerHTML=`<div class="box"><h3>Новая группа</h3>
    <p class="ctr">Готовый набор доменов или пустая группа</p>
    <div class="picks">
      ${PRESETS.map((p,i)=>`<button class="pick" data-preset="${i}">
        ${ICONS[p.icon]||ICONS.www}<span>${esc(p.name)}
        <i>${plural(p.lines.length,'запись','записи','записей')}</i></span></button>`).join('')}
      <button class="pick" data-preset="-1">${ICONS.www}<span>Пустая<i>своя</i></span></button>
    </div>
    <div class="bar"><button class="b ghost" id="pick-close">Отмена</button></div></div>`;

  const close=()=>{ el.hidden=true; el.className=''; el.innerHTML=''; };
  $('#pick-close').onclick=close;

  el.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.preset, rules=collect();
    const used=new Set();
    for(const r of rules) for(const g of r.groups) used.add(g.name.toLowerCase());

    let name,lines;
    if(n<0){ let i=1; while(used.has(('группа '+i).toLowerCase())) i++;
             name='группа '+i; lines=[]; }
    else{ const p=PRESETS[n]; name=p.name; lines=p.lines.slice();
          if(used.has(name.toLowerCase())){
            let i=2; while(used.has((name+' '+i).toLowerCase())) i++; name=name+' '+i; } }

    rules[ruleIdx].groups.push({name,on:true,lines});
    edit[ruleIdx+'.'+(rules[ruleIdx].groups.length-1)]=1;
    D.domains=buildDomains(rules);
    close(); touch(); query=''; draw();
  });
}

    <div class="fine">${disclaimer()}</div>
    <div class="bar"><button class="b" id="accept"
      style="flex:1;justify-content:center">Принимаю</button></div></div>`;
  $('#accept').onclick=()=>{
    try{ localStorage.setItem('sf-disclaimer','1'); }catch(e){}
    el.hidden=true; el.className=''; el.innerHTML='';
  };
}

/* Заставляем устройство разрешить случайное имя под доменом из своих же
   списков: иначе «Проверить снова» перечитывала бы прежний ответ. */
async function probe(){
  const host=(D.domains||'').split('\n').map(s=>s.trim())
    .find(s=>s && !/^[[#;]/.test(s) && !/=/.test(s) && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(s));
  if(!host) return;
  const name='sf'+Math.random().toString(36).slice(2,10)+'.'+host.replace(/^[*.=]+/,'');
  try{ await Promise.race([
    fetch('http://'+name+'/',{mode:'no-cors',cache:'no-store'}).catch(()=>{}),
    new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  await new Promise(r=>setTimeout(r,600));
}

function dnsWarn(){
  const el=$('#dns');
  el.className='modal'; el.hidden=false;
  el.innerHTML=`<div class="box warn"><h3>Устройство не спрашивает роутер</h3>
    <p class="ctr">Адрес устройства: ${esc(D.peer||'неизвестен')}</p>
    <div class="fine">
      <p>Демон видит DNS-ответы другим устройствам сети, но этому — ни одного.
      Значит имена оно разрешает мимо роутера, и <b>маршрутизация по доменам
      для него работать не будет</b>: адреса брать неоткуда. Подсети в списках
      при этом работают — они не зависят от DNS.</p>
      <p>Что обычно включено:</p>
      <ul>
        <li>в браузере — «Безопасный DNS», «Защищённый DNS», DNS-over-HTTPS;</li>
        <li>в Windows или macOS — DNS прописан вручную вместо получения от роутера;</li>
        <li>в Android или iOS — «Частный DNS», «Персональный DNS», Private Relay;</li>
        <li>на самом устройстве работает VPN или прокси.</li>
      </ul>
      <p>Выключи то, что найдёшь, и нажми «Проверить снова»: страница сама
      заставит устройство разрешить случайное имя и посмотрит, прошёл ли запрос
      через роутер. Никуда он не ведёт — такого имени не существует.</p></div>
    <div class="bar">
      <button class="b" id="dns-recheck">Проверить снова</button>
      <button class="b ghost" id="dns-close">Закрыть</button></div></div>`;

  const hide=()=>{ el.hidden=true; el.className=''; el.innerHTML=''; };
  $('#dns-close').onclick=()=>{ hide(); dnsShown=2; };
  $('#dns-recheck').onclick=async ev=>{
    ev.target.disabled=true; ev.target.textContent='проверяю…';
    await probe(); hide(); dnsShown=0; await load(1);
  };
}

/* ---- тема ---- */
function theme(){
  const set=document.documentElement.dataset.theme;
  if(set) return set;
  return matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
}
try{ const t=localStorage.getItem('sf-theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
function flipTheme(){
  const t=theme()==='light'?'dark':'light';
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('sf-theme',t); }catch(e){}
  if(D) chrome();
}

/* ---- события ---- */
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){ query=ev.target.value;
    const el=$('#view'); const pos=ev.target.selectionStart;
    draw(); const q=$('#q'); if(q){ q.focus(); q.setSelectionRange(pos,pos); }
    return; }
  if(ev.target.closest('.g')) touch();
});

document.addEventListener('click',async ev=>{
  const nav=ev.target.closest('aside nav button');
  if(nav){ tab=nav.dataset.tab; if(nodesMode!=='masked') nodesMode='masked';
           if(tab!=='conn'){ dnsLoaded=0; dnsInfo=null; }
           draw(); return; }

  if(ev.target.closest('#theme')||ev.target.closest('#theme2')) return flipTheme();

  const f=ev.target.closest('[data-fold]');
  if(f && ev.target.closest('button') && !ev.target.closest('.body')){
    folds[f.dataset.fold]=!folds[f.dataset.fold]; f.classList.toggle('open'); return; }

  const sw=ev.target.closest('[data-toggle]');
  if(sw){ const el=sw.closest('.g'), rules=collect();
    const g=rules[+el.dataset.r].groups[+el.dataset.g];
    g.on=!g.on; D.domains=buildDomains(rules); touch(); draw(); return; }

  const edb=ev.target.closest('[data-edit]');
  if(edb){ const el=edb.closest('.g'), id=el.dataset.id;
    if(edit[id]){ D.domains=buildDomains(collect()); delete edit[id]; }
    else edit[id]=1;
    draw(); return; }

  const del=ev.target.closest('[data-del]');
  if(del){ const el=del.closest('.g'), rules=collect();
    if(!confirm('Удалить группу «'+rules[+el.dataset.r].groups[+el.dataset.g].name+'»?')) return;
    rules[+el.dataset.r].groups.splice(+el.dataset.g,1);
    D.domains=buildDomains(rules); edit={}; touch(); draw(); return; }

  const addg=ev.target.closest('[data-addgrp]');
  if(addg){ D.domains=buildDomains(collect()); picker(+addg.dataset.addgrp); return; }

  if(ev.target.closest('#newrule')){
    const t=prompt('Куда заворачивать? Имя политики Keenetic либо интерфейса:',
                   D.policy_name);
    if(!t) return;
    const rules=collect();
    rules.push({target:t.trim(),groups:[]});
    D.domains=buildDomains(rules); touch(); draw(); picker(rules.length-1); return; }

  if(ev.target.id==='apply'){
    const btn=ev.target; btn.disabled=true;
    D.domains=buildDomains(collect(true));
    const ok=await save('domains',D.domains,'m-rules');
    btn.disabled=false;
    if(ok){ dirty=false; edit={}; showBar(); }
    return; }

  if(ev.target.id==='undo'){ dirty=false; edit={}; showBar(); load(); return; }

  if(ev.target.closest('#nodes-show')){
    const r=await fetch(api('/data?reveal=1'));
    if(r.ok){ D=await r.json(); nodesMode='shown'; draw(); } return; }
  if(ev.target.closest('#nodes-new')){ nodesMode='new'; draw(); $('#nodes')?.focus(); return; }
  if(ev.target.closest('#nodes-hide')){ nodesMode='masked'; load(); return; }

  if(ev.target.id==='reshow'){ ev.preventDefault();
    try{ localStorage.removeItem('sf-disclaimer'); }catch(e){}
    gate(); return; }

  const dset=ev.target.closest('[data-dnsset]');
  if(dset){ const k=dset.dataset.dnsset; dnsPick[k]=!dnsPick[k];
    folds.dnscmd=1; draw(); return; }

  if(ev.target.closest('[data-dnsisp]')){ dnsIsp=!dnsIsp;
    folds.dnscmd=1; draw(); return; }

  if(ev.target.id==='dns-apply'){
    const btn=ev.target, m=$('#m-dns');
    const picked=DNSSETS.filter(x=>dnsPick[x.key]);
    const isp=(dnsInfo && dnsInfo.ok && dnsIsp) ? (dnsInfo.isp||[]) : [];
    if(!picked.length && !isp.length){
      m.className='msg bad'; m.textContent='ничего не выбрано'; return; }

    let what=[];
    if(picked.length) what.push('добавить '+picked.map(x=>x.name).join(', '));
    if(isp.length) what.push('отключить DNS провайдера на '+isp.join(', '));
    if(!confirm('В настройках роутера: '+what.join('; ')+
                '?\nСуществующие серверы не удаляются.')) return;
    btn.disabled=true; m.className='msg'; m.textContent='выполняю…';
    try{
      const r=await fetch(api('/dns?sets='+picked.map(x=>x.key).join(',')+
                              (isp.length?'&isp=1':'')),{method:'POST'});
      const t=await r.text();
      m.className=r.ok?'msg ok':'msg bad';
      m.textContent=r.ok?'готово':'были сбои';
      dnsInfo={report:t};
      $('#dnsbox').innerHTML=dnsBox();
      setTimeout(loadDns,2000);
    }catch(e){ m.className='msg bad'; m.textContent=e.message; }
    btn.disabled=false; return; }

  const b=ev.target.closest('[data-save]');
  if(b) return save(b.dataset.save,$('#'+b.dataset.save).value,'m-'+b.dataset.save);
});

addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

if(!seen()) gate();
load();
setInterval(()=>{
  if(dirty || document.querySelector('textarea:focus,input:focus')) return;
  if(document.querySelector('.modal')) return;   /* поверх открытого окна незачем */
  load(0,1);
},10000);
</script>
